[package]
name = "hookverify"
version = "0.1.0"
edition = "2021"
description = "Verify a webhook signature (GitHub, Stripe, or generic HMAC-SHA256) with a constant-time compare"
license = "MIT"
authors = ["Animesh Raj <animesh080808@gmail.com>"]
repository = "https://github.com/itsarraj/hookverify"
readme = "README.md"
keywords = ["webhook", "hmac", "signature", "stripe", "github"]
categories = ["command-line-utilities"]

[lib]
name = "hookverify"
path = "src/lib.rs"

[[bin]]
name = "hookverify"
path = "src/main.rs"

[dependencies]
hmac = "0.12"
sha2 = "0.10"
subtle = "2"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
